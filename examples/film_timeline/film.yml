# A short film's plan: a wake, a comparison played at 8 frames a second with a freeze, and
# its last frame held. The frames are generated by run.py; nothing is drawn here: `film
# lengths` plans the film and `film srt` lists its captions' times. Reference:
# docs/guide/film/film.md.
output: film.mp4
fps: 24
size: [1920, 1080]
include: style.yml
scenes:
  - name: wake                        # 120 frames at 24 a second: 5 s
    fade: [1, 0]
    layout:
      boxes:
        - name: main
          shot: {frames: frames/wake}
        - text: ['A smooth cylinder in a steady current']
          at: [0.5, 3]
        - text: ['rms $C_L$: 0.55 → 0.06']
          pos: [1300, 120]
          at: [3.2, 4.9]
  - name: compare                     # 48 frames at 8 a second: 6 s, and a freeze of 3 s
    fade: [0.5, 0.5]
    layout:
      boxes:
        - name: main
          shot:
            frames: frames/compare
            rate: {fps: 8, to_output: interpolate}
            freezes: [{at: 2.0, hold: 3.0}]
        - text: ['Each cycle sheds one vortex from each side,', 'pushing it up and down']
          at: [0.3, 1.8]
        - text: ['The grooved cylinder barely moves']
          place: top
          at: [2.0, 5.0]              # in the freeze
  - name: end                         # the comparison's last frame, held
    seconds: 4
    fade: [0, 2]
    layout:
      boxes:
        - last_frame: compare
