[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowreel"
version = "0.0.1"
description = "Films of flow simulations from configuration files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/flowreel/fonts/OFL.txt"]
dependencies = [
    "numpy",
    "scipy",
    "pyvista>=0.44",
    "vtk>=9.3",
    "matplotlib>=3.8",
    "Pillow>=10",
    "PyYAML>=6",
    "shellkit @ git+https://github.com/arunperiyal/shellkit.git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowreel = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
