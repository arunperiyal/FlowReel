# A shot on generated data (see run.py): a solid-body vortex round a sphere, 48 frames
# over three time steps, its speed on a slice. Its camera starts at the view 'start'; the editor picks
# the track 'approach', which the shot can then use with camera: {track: approach}.
name: editor_demo
source: vortex                  # the tag run.py imports: a generated vortex, three steps
time: {keys: [[0, 0], [47, 2]]}   # 48 frames over steps 0 to 2
camera: {view: start}
size: [640, 360]
layers:
  - {type: outline, bounds: domain, colour: "#8899aa", width: 2}
  - {type: body, colour: "#c8ccd0"}
  - {type: slice, normal: z, position: 0.25, field: speed, range: [0, 1.6], opacity: 0.8}
