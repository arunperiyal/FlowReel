# The documentation website (plan/questions.md, Section 24, question 8). Build it with
#   pip install -e ".[docs]" && mkdocs serve
# and check it as CI does with: mkdocs build --strict
site_name: FlowReel
site_description: Films of flow simulations from configuration files
site_url: https://arunperiyal.github.io/FlowReel/
repo_url: https://github.com/arunperiyal/FlowReel
repo_name: arunperiyal/FlowReel
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # anchors as GitHub makes them, so a link to a heading works on both
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - A steady flow:
          - tutorials/steady/index.md
          - 1. Install: tutorials/steady/01-install.md
          - 2. The project and the data: tutorials/steady/02-project.md
          - 3. A first shot: tutorials/steady/03-first-shot.md
          - 4. The camera: tutorials/steady/04-camera.md
          - 5. A second shot: tutorials/steady/05-sweep.md
          - 6. A panel: tutorials/steady/06-panel.md
          - 7. The film file: tutorials/steady/07-film.md
          - 8. Building the film: tutorials/steady/08-build.md
          - The data: tutorials/steady/data.md
      - A flow that moves:
          - tutorials/unsteady/index.md
          - 1. The data and the project: tutorials/unsteady/01-data.md
          - 2. A shot that moves: tutorials/unsteady/02-shot.md
          - 3. The force beside it: tutorials/unsteady/03-panel.md
          - 4. The film: tutorials/unsteady/04-film.md
          - 5. On a cluster: tutorials/unsteady/05-cluster.md
          - The data: tutorials/unsteady/data.md
  - User guide:
      - The project and its data:
          - Projects: guide/projects/project.md
          - Rules: guide/projects/rules.md
          - Data and tags: guide/projects/data.md
          - Sources: guide/projects/sources.md
          - Bodies: guide/projects/bodies.md
          - Derived fields: guide/projects/fields.md
      - Shots and panels:
          - Shot files: guide/shots/shots.md
          - Flow layers: guide/shots/layers-flow.md
          - Layers without flow data: guide/shots/layers-markers.md
          - Tracks: guide/shots/tracks.md
          - Cameras and lights: guide/shots/cameras.md
          - The camera editor: guide/shots/camera-editor.md
          - Long bodies: guide/shots/long-bodies.md
          - Panels: guide/shots/panels.md
      - The film:
          - The film and its scenes: guide/film/film.md
          - Layouts and boxes: guide/film/layouts.md
          - Boxes: guide/film/boxes.md
      - Making it:
          - Rendering and caching: guide/making/rendering.md
          - Rendering on Slurm: guide/making/slurm.md
          - Building the film: guide/making/build.md
          - Checking the film: guide/making/check.md
      - Worked example:
