# Staggered spanwise grooves on generated geometry (no data): six straight grooves
# round the cylinder, each cut into segments 1.5 long with 0.5 gaps, every groove's
# segments half a period along from its neighbours', like bricks. The front carves
# them from end to end, a cutter glowing on each segment it is cutting, then the
# camera closes in. Try:
#   flowreel shot preview examples/grooves/shots/grooves.yml
#   flowreel shot render examples/grooves/shots/grooves.yml -j 8
name: grooves
source: cylinder                    # the tag: data/cylinder/ (a generated body)
time: {frozen: 0, frames: 192}
camera: {track: carve}
size: [1920, 1080]
background: black
antialias: ssaa
layers:
  - type: geometry
    body: grooved_cylinder
    params:
      grooves: 6
      turns: 0                                 # straight: spanwise grooves
      phase: 0
      width: 0.16
      depth: 0.06
      length: 1.5                              # a segment along the span
      gap: 0.5                                 # between segments of one groove
      stagger: 0.5                             # neighbours half a period apart
      cut_front: {from: -0.3, to: 12.3, frames: [10, 150]}
    colour: "#d4d9db"
    blend:
      - {array: groove, colour: "#4aa3df", weight: 0.45}
      - {array: fresh, colour: "#bfe6ff", weight: 0.6}
    specular: 0.45
    specular_power: 30
    ambient: 0.18
    sharp_edges: false
    markers:
      - {points: cutters, radius: 0.05, colour: "#bfe6ff", lighting: false}
      - {points: cutters, radius: 0.13, colour: "#bfe6ff", opacity: 0.25, lighting: false}
