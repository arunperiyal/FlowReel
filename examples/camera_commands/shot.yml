# A shot that needs no data: the grooved cylinder of the geometry source (12 long, along
# x). run.sh makes its camera track 'turn' with camera orbit, round the middle groove.
name: turn
source: geometry:grooved_cylinder
time: {frozen: 0, frames: 48}
camera: {track: turn}
size: [640, 360]
lights: raking
layers:
  - {type: geometry, body: grooved_cylinder, colour: "#c8ccd0"}
