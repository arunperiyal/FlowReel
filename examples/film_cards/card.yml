# An opening card: a logo, a title, a divider, two groups of names and small print.
# logo.png is generated by run.py; a real film's logo stays outside the repository.
background: '#05080c'
blocks:
  - {image: logo.png, height: 160, y: 120}
  - title: ['Flow past a cylinder', 'with helical grooves']
    size: 64
    spacing: 84
    gap: 70
  - {divider: 360, gap: 40}
  - {heading: CREATED BY, names: ['A. Author'], gap: 46}
  - {heading: WITH, names: ['B. Author', 'C. Author'], gap: 26, colour: '#f5a142'}
  - {text: ['Made with FlowReel, from generated data'], gap: 50}
