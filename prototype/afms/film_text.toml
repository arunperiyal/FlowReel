# Every piece of text in the film. Edit this file, then run:  python make_film.py film
# That takes about a minute; frames are not redrawn. Delete a [[caption]] block to drop it.
#
# Caption fields
#   shot    which shot it sits on: domain, bare_reveal, carve, helical_reveal, compare,
#           top, slices, section, wall, liftmap, end
#   lines   one string per line
#   start   seconds from the start of the shot (freezes included, see below)
#   end     seconds from the start of the shot; leave it out to stay to the end
#   place   "bottom", "top" or "centre", or [x, y] in pixels for the top-left corner
#           of the text, or ["centre", y] to centre it across the frame with its top
#           at y. The frame is 1920 x 1080, with [0, 0] at the top left
#   size    letter height in pixels (default 50)
#   align   "left" or "centre" (default "centre")
#   colour  a colour such as "#f5a142" (default near-white)
#   box     true puts a dark panel behind the text (default false: a soft shadow)
#           Text between $ signs is set as mathematics (LaTeX, as in matplotlib):
#           "rms $C_L$", "$m^* = 10$", "$12D \\times 30D$"
#   arrows  [[x1, y1, x2, y2], ...] in pixels, each pointing from x1, y1 to x2, y2;
#           drawn in the caption's colour and faded with it. arrow_width sets the width
#
# Shot lengths: opening as set below, domain 12 s (7 s still, then the move in),
# bare_reveal 15.1 s, carve 12 s, helical_reveal 15.1 s, compare 15.1 s plus its
# freezes, top, slices, section and wall 6.1 s each, liftmap 6 s, end 13 s.

[opening]
title = ["Effect of Helical Groove on Suppression of", "Vortex-Induced Vibration in Flexible Cylinders"]
created_by = ["Arun Periyal"]
coauthors = ["Ritwik Ghoshal, Vaibhav Joshi,", "Abhijeet Sajjan and Arun Jyoti Sarkar"]
seconds = 7

# Music under the whole film. Delete this section for a silent film.
#   file      relative to this folder
#   volume    1.0 as recorded; 0.5 is half
#   start     seconds into the track to begin from
#   fade_in, fade_out   seconds; the fade out ends with the film
# Pixabay track: the Pixabay Content License allows use without credit. Keep a copy of
# the licence page for this track with the entry, since the copyright passes to AFMS.
[audio]
file = "assets/nastelbom-background-music-602454.mp3"
volume = 0.8
start = 0
fade_in = 1.5
fade_out = 4

# Names and colours of the two cases: used for the comparison labels and the plot legend.
[cases]
bare = { name = "Smooth", colour = "#e6e9ec" }
helical = { name = "Helical grooves", colour = "#f5a142" }

# Axis labels of the live plots in the comparison. Matplotlib mathtext between $ signs.
[plots]
time = "$tU/D$"
displacement = "Mid-span $y/D$"
lift = "$C_L$"
drag = "$C_D$"
span = "Span $x/D$"
sectional_lift = "Sectional $C_L$"

