# The rendered frames as one scene, at 12 frames a second brought to the film's 24. Every
# text and arrow below points at the sphere (centre (0, 0, 0.5), radius 0.2) and follows it
# as the camera pans. Reference: docs/guide/film/layouts.md.
output: film.mp4
fps: 24
size: [640, 360]
scenes:
  - name: pan
    layout:
      boxes:
        - name: main
          shot: {file: shots/pan.yml, rate: {fps: 12, to_output: interpolate}}
        - text: {lines: ['The body'], size: 26, align: left}
          follow: {box: main, model: [0, 0, 0.5], offset: [70, -90]}   # beside the sphere
          at: [0.2, 1.9]
        - shape: {kind: arrow, direction: down_left, width: 3}          # down to its top
          follow: {box: main, model: [0, 0, 0.72], offset: [0, 0]}
          size: [60, 40]
          at: [0.2, 1.9]
