# The second tutorial's film: three scenes, 17.2 seconds. Reference: docs/guide/film/film.md.
output: film.mp4
fps: 24
size: [1920, 1080]
scenes:
  - name: title
    seconds: 3
    fade: [0.5, 0.5]
    layout: title                     # layouts/title.yml
  - name: board                       # 9.2 s of frames and a 2 s freeze
    fade: [0.5, 0]
    layout: board                     # layouts/board.yml
  - name: end
    seconds: 3
    fade: [0, 1.5]
    layout:
      boxes:
        - last_frame: board
        - text: {lines: ['Made with FlowReel'], align: left, valign: top}
          pos: [60, 960]
          at: [0.3, 2.5]
