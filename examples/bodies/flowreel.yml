# The project of examples/bodies, as a person writes it after `project init`: the zones
# get names a shot can use, the measured axis and diameter are checked, and the supports
# are filled in. run.py writes the data this refers to into data/.
bodies:
  riser:
    zone: cyl                    # the surface zone in data/; shots say riser
    axis: x
    diameter: 1.0
    ends:
      - {at: 0.0, support: pinned}
      - {at: 40.0, support: roller, free_along: x, tension: true}
    series:
      displacement:              # one CSV per probe node, as FlexFlow Analyzer writes them
        file: data/riser_disp_{node}.csv
        by: node
        stations: [0.0, 10.0, 20.0, 30.0, 40.0]
        columns: {dy: aleDisp_y}
  ball:
    zone: ball                   # not slender: no axis, no ends
  pendulum:                      # modelled by the solver, not meshed: a virtual body
    virtual: true
    shape: pendulum
    params: {length: 4.0, bob: 0.6, rod: 0.08, swing: [1, 0, 0]}   # swings across the span
    attach: {body: riser, station: 20}
    drive:
      angle: {series: swing, column: pendDisp}                     # radians
    series:
      swing: data/pendulum.csv
