# The film of this example: two scenes of frame folders in boxes (layouts/). Eight frames
# a second, so each scene is the folder's eight frames, one second. Reference:
# docs/guide/film/film.md.
output: film.mp4
fps: 8
size: [960, 540]
scenes:
  - name: compare
    layout: compare
  - name: grid
    layout: grid
