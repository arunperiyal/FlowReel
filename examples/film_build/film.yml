# A small film of scenes, built by run.py from generated frames and a generated tone.
# Reference: docs/guide/film/film.md.
output: film.mp4
fps: 24
size: [640, 360]
style:
  looks:
    text: {size: 28, margin: 30, valign: bottom}     # captions sit low, as captions do
audio:
  - {file: tone.wav, volume: 0.5, fade: [1, 1.5]}    # generated by run.py; no music here
watermark: {text: 'FlowReel example', size: 16, opacity: 0.6}
scenes:
  - name: opening                  # a title: text and a line, no shot
    seconds: 2
    fade: [0.5, 0.5]
    chapter: Opening
    layout:
      boxes:
        - text: {lines: ['Flow past a cylinder'], look: title, size: 36, valign: bottom}
          place: top
        - shape: {kind: line, width: 2, colour: '#96a5b2'}
          pos: [240, 178]
          size: [160, 3]
        - text: {lines: ['Generated by FlowReel'], look: small, size: 22, valign: top}
          place: bottom
  - name: wake                     # 24 frames at 8 a second: 3 s, interpolated to 24, and a freeze
    fade: [0.5, 0]
    chapter: The wake
    layout:
      boxes:
        - name: main
          shot:
            frames: frames/wake
            rate: {fps: 8, to_output: interpolate}
            freezes: [{at: 1.0, hold: 1.5}]
        - text: ['A wake of $Re = 100$']
          at: [0.3, 1.0]
        - text: ['Frozen: one vortex leaving the top']
          place: top
          at: [1.0, 2.5]           # in the freeze, which runs from 1.0 to 2.5
        - text: ['Shedding again']
          at: [3.3, 4.1]
        - shape: {kind: arrow, direction: up_right, width: 3}
          pos: [200, 190]
          size: [100, 110]
          at: [3.3, 4.1]
  - name: end                      # the wake's last frame, held, under a closing line
    seconds: 2
    fade: [0, 1]
    chapter: {title: Thanks, at: 0.5}
    layout:
      boxes:
        - last_frame: wake
        - text: ['Thank you']
          place: centre
          at: [0.8, 2]
