# The documentation website (docs/PLAN.md, Section 24, question 8). Build it with
#   pip install -e ".[docs]" && mkdocs serve
# and check it as CI does with: mkdocs build --strict
site_name: FlowReel
site_description: Films of flow simulations from configuration files
site_url: https://arunperiyal.github.io/FlowReel/
repo_url: https://github.com/arunperiyal/FlowReel
repo_name: arunperiyal/FlowReel
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# The plan is the design, read in the repository, not part of the user's documentation.
exclude_docs: |
  PLAN.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # anchors as GitHub makes them, so a link to a heading works on both
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Tutorial:
      - tutorial/index.md
      - 1. Install: tutorial/01-install.md
      - 2. The project and the data: tutorial/02-project.md
      - 3. A first shot: tutorial/03-first-shot.md
      - 4. The camera: tutorial/04-camera.md
      - 5. A second shot: tutorial/05-sweep.md
      - 6. A panel: tutorial/06-panel.md
      - 7. The film file: tutorial/07-film.md
      - 8. Building the film: tutorial/08-build.md
      - The data: tutorial/data.md
  - Second tutorial:
      - tutorial/unsteady/index.md
      - 1. The data and the project: tutorial/unsteady/01-data.md
      - 2. A shot that moves: tutorial/unsteady/02-shot.md
      - 3. The force beside it: tutorial/unsteady/03-panel.md
      - 4. The film: tutorial/unsteady/04-film.md
      - 5. On a cluster: tutorial/unsteady/05-cluster.md
      - The data: tutorial/unsteady/data.md
  - User guide:
      - Projects and data:
          - Projects: project.md
          - Rules: rules.md
          - Sources: sources.md
          - Bodies: bodies.md
          - Derived fields: fields.md
      - Shots:
          - Shot files: shots.md
          - Flow layers: layers-flow.md
          - Layers without flow data: layers-markers.md
          - Tracks: tracks.md
          - Cameras and lights: cameras.md
          - The camera editor: camera-editor.md
      - Rendering:
          - Rendering and caching: rendering.md
          - Long bodies: long-bodies.md
          - Rendering on Slurm: slurm.md
      - Composing:
          - Compose: compose.md
          - Layouts: layouts.md
          - Panels: panels.md
      - The film:
          - The film file: film.md
          - Captions and shapes: captions.md
          - Cards: cards.md
          - Clips: clips.md
          - Building the film: build.md
      - Worked example:
          - The reveal look: reveal.md
  - Reference:
      - Commands, by example: commands.md
      - Every command and option: reference/commands.md
      - YAML keys: reference/yaml.md
