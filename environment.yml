# The conda environment FlowReel runs in. pip cannot install ffmpeg, so it is declared
# here rather than in pyproject.toml. Create or update the environment with:
#   conda env create -f environment.yml        (or: conda env update -n flexflow_env -f environment.yml)
#   conda activate flexflow_env
#   pip install --no-deps -e .
name: flexflow_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ffmpeg>=5.1          # clips and the film; FlowReel checks version and filters
  - numpy
  - pandas>=2
  - scipy
  - pyvista>=0.44
  - vtk>=9.3
  - matplotlib>=3.8
  - pillow>=10
  - pyyaml>=6
  - pytest>=7
  - pip
  - pip:
      - git+https://github.com/arunperiyal/shellkit.git
