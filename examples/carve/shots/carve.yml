# The carving shot of the reference film, at full size, on generated geometry (no data):
# four helical grooves are cut into a smooth cylinder by glowing cutters, then the
# camera closes in on a groove and ends on the main view. Try:
#   flowreel shot preview examples/carve/shots/carve.yml          # every 10th frame, small
#   flowreel shot render examples/carve/shots/carve.yml -j 8 --frames 100:140
name: carve
source: cylinder                    # the tag: data/cylinder/ (a generated body)
time: {frozen: 0, frames: 288}
camera: {track: carve}
size: [1920, 1080]
background: black
antialias: ssaa
layers:
  - type: geometry
    body: grooved_cylinder
    params:
      cut_front: {from: -0.3, to: 12.3, frames: [51.66, 172.2]}   # cutters run 0.18 to 0.6
    colour: "#d4d9db"                          # the smooth body
    blend:
      - {array: groove, colour: "#f5a142", weight: 0.45}   # cut grooves: the helical colour
      - {array: fresh, colour: "#ffd98c", weight: 0.6}     # glow along fresh cuts
    specular: 0.45
    specular_power: 30
    ambient: 0.18
    sharp_edges: false                         # groove walls are steep but smooth
    markers:                                   # the cutters: a core and a soft glow
      - {points: cutters, radius: 0.06, colour: "#ffd08a", lighting: false}
      - {points: cutters, radius: 0.16, colour: "#ffd08a", opacity: 0.25, lighting: false}
