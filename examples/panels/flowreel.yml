# Two cylinders' forces and motions, and a pendulum's swing, as CSV histories
# (run.py writes them).
bodies:
  bare:
    series:
      force: {file: data/bare_force.csv, columns: {cl: CL, cd: CD}}
      motion: data/bare_motion.csv
  helical:
    series:
      force: {file: data/helical_force.csv, columns: {cl: CL, cd: CD}}
      motion: data/helical_motion.csv
  pendulum:
    virtual: true
    shape: pendulum
    series:
      swing: data/pendulum.csv
