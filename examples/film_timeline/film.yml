# A short film's plan: a wake, a comparison played at 8 frames a second with a freeze,
# and its last frame held. The frames are generated by run.py; nothing here is drawn
# yet (that is the film build, Phase 4 branches 4 and 5).
output: film.mp4
fps: 24
size: [1920, 1080]
include: style.yml
shots:
  - name: wake
    frames: frames/wake
    fade: [1, 0]
    text: text/wake.yml
  - name: compare
    frames: frames/compare
    rate: {fps: 8, to_output: interpolate}
    fade: [0.5, 0.5]
    freezes:
      - at: 2.0
        hold: 3.0
        text: [{lines: ['The grooved cylinder barely moves'], place: top}]
    text: text/compare.yml
  - {name: end, hold_last_of: compare, seconds: 4, fade: [0, 2], fade_out_at: 1.5}
