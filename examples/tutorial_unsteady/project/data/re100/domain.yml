# domain.yml of the tag 're100', written by `flowreel data import` and edited by hand
# (a second import with --force keeps your edits). Reference:
# docs/guide/projects/data.md.
kind: plt
source: {path: plt}
units:                            # the record's units: D, U and the density are 1
  rho: 1.0
  u_inf: 1.0
  mu: 0.01                        # rho U D / Re, with Re = 100
bodies:
  cylinder:
    zone: cylinder
    axis: z                       # the span: this 2D flow was given a thin one along z
    diameter: 1.0
    series:
      force: {file: series/force.csv}   # time, fx, fy, mz: copied in from the case
