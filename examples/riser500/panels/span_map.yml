# The riser's displacement against span and time, filling in with the travelling shot.
type: map
size: [960, 360]
times: {shot: ../shots/travel.yml}
style: {font_size: 14}
rows:
  - {body: riser, series: displacement, column: dy, title: riser}
x: {label: '$tU/D$', range: [0, 3.5]}
y: {label: 'Span $x/D$', ticks: [0, 250, 500]}
colormap: fire_ice
range: [-0.6, 0.6]
colorbar: {label: '$y/D$'}
margins: {left: 0.1, right: 0.88, top: 0.86, bottom: 0.18}
