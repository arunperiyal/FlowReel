# A frozen shot on generated data (see run.py): the camera pans round a sphere while
# the flow stays at one step. shot render records each frame's camera beside the
# frames, which is what lets the film's captions follow points of the model.
name: anchored
source: vortex:generated         # run.py builds the source in code
time: {frozen: 0, frames: 24}
camera: {track: pan}
size: [640, 360]
lights: raking
layers:
  - {type: outline, bounds: domain, colour: "#8899aa", width: 2}
  - {type: body, colour: "#c8ccd0"}
