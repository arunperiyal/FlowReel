# A small film project on generated data, built by run.py: silent, an opening title, the
# comparison of two cases (wakes and live plots, with a freeze), its last frame held
# (plots included), and a watermark of text. Positions are pixels of this 960 x 540 film.
# Reference: docs/guide/film/film.md.
output: film.mp4
fps: 24
size: [960, 540]
style:
  looks:
    text: {size: 24, margin: 30}
watermark: {text: 'FlowReel example', size: 14, opacity: 0.6}
scenes:
  - name: opening
    seconds: 2
    fade: [0.5, 0.5]
    layout:
      boxes:
        - text: {lines: ['Flow past two cylinders'], look: title, size: 36, valign: bottom}
          place: top
        - shape: {kind: line, width: 2, colour: '#96a5b2'}
          pos: [380, 270]
          size: [200, 3]
        - text: {lines: ['bare and helically grooved'], look: small, size: 22, valign: top}
          place: bottom
  - name: compare                    # 24 wake frames at 8 a second: 3 s, and a freeze of 1.5 s
    fade: [0.5, 0]
    layout: compare
  - name: end                        # the comparison's last frame, plots included, held
    seconds: 2
    fade: [0, 1]
    layout:
      boxes:
        - last_frame: compare
        - text: ['Thank you']
          place: centre
          at: [0.3, 2]
