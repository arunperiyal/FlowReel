[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowreel"
version = "0.0.1"
description = "Films of flow simulations from configuration files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/flowreel/fonts/OFL.txt"]
# Each minimum is tested in CI (.github/workflows/tests.yml, the oldest job); where no
# other reason sets it, it is the first release with wheels for Python 3.12. VTK 9.5 is
# the first whose wheels render off screen in worker processes without crashing (9.3 has
# no OSMesa or EGL; 9.4.2's render workers die with OSMesa); pyvista 0.47 the first with
# extract_points(pass_cell_ids=) and extract_surface(algorithm=).
# below 3.11, which lays text out a few pixels lower (docs/PLAN.md, Section 24, q. 9).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1.1",
    "scipy>=1.11.2",
    "pyvista>=0.47",
    "vtk>=9.5",
    "matplotlib>=3.8",
    "Pillow>=10.1",
    "PyYAML>=6.0.1",
    "shellkit @ git+https://github.com/arunperiyal/shellkit.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# the documentation website: mkdocs build --strict (mkdocs.yml)
docs = ["mkdocs-material==9.8.1"]

[project.scripts]
flowreel = "flowreel.cli:main"

[project.entry-points."flowreel.sources"]
flexflow = "flowreel.sources.flexflow:FlexflowSource"
vtk = "flowreel.sources.vtk:VtkSource"
geometry = "flowreel.sources.geometry:GeometrySource"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowreel = ["fonts/*.ttf", "fonts/OFL.txt", "jobs/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
