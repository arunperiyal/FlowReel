# A shot that needs no data: the grooved cylinder of the tag cylinder (the geometry source), seen through
# the view `main` that project init wrote to the project's cameras.yml.
name: cylinder
source: cylinder                    # the tag: data/cylinder/ (a generated body)
time: {frozen: 0, frames: 12}
camera: {view: main}
size: [640, 360]
antialias: ssaa
layers:
  - {type: outline, width: 2}
  - {type: geometry, body: grooved_cylinder, colour: "#c8ccd0"}
