# The comparison's live plots: mid-span displacement, lift and drag of both cases,
# drawn up to each wake frame's time (the prototype's compose_compare.py plots).
type: series
size: [640, 1080]
times: [2.02, 2.27, 2.52, 2.77, 3.02, 3.27, 3.52, 3.77, 4.02, 4.27, 4.52, 4.77,
        5.02, 5.27, 5.52, 5.77, 6.02, 6.27, 6.52, 6.77, 7.02, 7.27, 7.52, 7.77]
x: {label: '$tU/D$', range: [0, 8]}
rows:
  - label: 'Mid-span $y/D$'
    lines:
      - {body: bare, series: motion, column: y, label: Bare, colour: '#e8b04a'}
      - {body: helical, series: motion, column: y, label: Helical, colour: '#6ac1c8'}
  - label: '$C_L$'
    lines:
      - {body: bare, series: motion, column: cl, colour: '#e8b04a'}
      - {body: helical, series: motion, column: cl, colour: '#6ac1c8'}
  - label: '$C_D$'
    lines:
      - {body: bare, series: motion, column: cd, colour: '#e8b04a'}
      - {body: helical, series: motion, column: cd, colour: '#6ac1c8'}
margins: {left: 0.2, right: 0.95, top: 0.93, bottom: 0.08, space: 0.18}
