# A window 20 long travels along the riser from station 20 to 480, the camera with it.
# Each frame reads the window's part of the PLT file and nothing else. margin covers
# the riser's motion (0.6 at most) so no cell is lost when it moves.
name: travel
source: {adapter: plt, path: case, margin: 1.0}
time: {steps: [0, 7]}
crop:
  around: {body: riser, station: {from: 20, to: 480, frames: [0, 7], ease: linear}}
  half: [10, 4, 4]
camera: {view: close, follow: true}
size: [640, 360]
lights: raking
layers:
  - {type: outline, bounds: crop, colour: "#8fa3b3", width: 1.5}
  - {type: slice, normal: z, position: 0, field: U, range: [0, 1], colormap: viridis}
  - {type: body, body: riser, colour: "#c8ccd0"}
  - {type: axes, corner: lower_left, size: 90}
