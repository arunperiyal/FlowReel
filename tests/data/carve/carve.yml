# The carving shot of the reference film (prototype/afms/render_carve.py): four helical
# grooves are cut into the smooth cylinder by glowing cutters running along the span,
# then the camera closes in on a groove and ends on the main view. Geometry alone, no
# flow data. 288 frames; the prototype's fractions of the shot are frames here
# (t * 287). The golden frame is 115, at 640 x 360.
name: carve
source: geometry:grooved_cylinder
time: {frozen: 0, frames: 288}
camera: {track: carve}
size: [640, 360]
background: black
antialias: ssaa
layers:
  - type: geometry
    body: grooved_cylinder
    params:
      cut_front: {from: -0.3, to: 12.3, frames: [51.66, 172.2]}   # cutters run 0.18 to 0.6
    colour: "#d4d9db"                          # the smooth body
    blend:
      - {array: groove, colour: "#f5a142", weight: 0.45}   # cut grooves: the helical colour
      - {array: fresh, colour: "#ffd98c", weight: 0.6}     # glow along fresh cuts
    specular: 0.45
    specular_power: 30
    ambient: 0.18
    sharp_edges: false                         # groove walls are steep but smooth
    markers:                                   # the cutters: a core and a soft glow
      - {points: cutters, radius: 0.06, colour: "#ffd08a", lighting: false}
      - {points: cutters, radius: 0.16, colour: "#ffd08a", opacity: 0.25, lighting: false}
