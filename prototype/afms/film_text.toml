# Freezes stop the picture part way through a flow shot and show text while it is still.
#   shot   the flow shot to stop
#   at     seconds of flow before it stops, counted without earlier freezes
#   hold   seconds it stays still; the shot grows by this much
#   lines, place, size, align, colour, box, arrows   as for captions; shown during the hold
# Captions on the same shot count time with the freezes included: a caption after a
# 5 s freeze at 4 s that should appear 2 s later in the flow starts at 4 + 5 + 2 = 11.
# Drag is left out until the helical drag from OISD is checked (it differs by about 8 %
# from an independent integral of the surface traction).
[[freeze]]
shot = "compare"
at = 5.0
hold = 6.0
lines = ["Cross-flow motion at mid-span: 43% smaller", "rms $y/D$: 0.69 → 0.39"]
place = [80, 420]
size = 42
align = "left"
box = true
arrows = [[1010, 445, 1390, 230]]

[[freeze]]
shot = "compare"
at = 11.0
hold = 6.0
lines = ["Lift fluctuation: about 9 times smaller", "rms $C_L$: 0.55 → 0.06"]
place = [80, 420]
size = 42
align = "left"
box = true
arrows = [[1010, 445, 1390, 535]]
