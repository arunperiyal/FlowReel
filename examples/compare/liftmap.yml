# Sectional lift of both cases against span and time, filling in from the left (the
# prototype's render_extras.py liftmap). The right third is left clear for a caption.
type: map
size: [1920, 1080]
times: [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3, 3.25, 3.5, 3.75, 4, 4.25, 4.5, 4.75, 5, 5.25, 5.5, 5.75, 6, 6.25, 6.5, 6.75, 7, 7.25, 7.5, 7.75, 8]
style: {font_size: 20}
x: {label: '$tU/D$'}
y: {label: 'Span $x/D$', ticks: [3, 6, 9]}
rows:
  - {body: bare, series: lift, column: cl, title: Bare, colour: '#e8b04a'}
  - {body: helical, series: lift, column: cl, title: Helical, colour: '#6ac1c8'}
colormap: fire_ice
range: [-1.5, 1.5]
colorbar: {label: 'Sectional $C_L$', fraction: 0.025, pad: 0.02}
title_size: 26
margins: {left: 0.07, right: 0.66, top: 0.93, bottom: 0.1, space: 0.25}
