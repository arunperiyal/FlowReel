# The tag 'riser': the generated riser case (riser500_case.py), a riser 500 diameters long,
# pinned at one end and on a roller under tension at the other, a short cylinder beside it,
# and a pendulum hung from the riser at mid-span, modelled by the solver and not meshed.
# Reference: docs/guide/projects/data.md and docs/guide/projects/bodies.md.
kind: plt
source: {path: plt}
bodies:
  riser:
    zone: cyl
    axis: x
    diameter: 1.0
    ends:
      - {at: 0.0, support: pinned}
      - {at: 500.0, support: roller, free_along: x, tension: true}
    series:
      displacement:                       # 51 probes, one CSV each, as the Analyzer writes them
        file: series/riser_disp_{node}.csv
        by: node
        stations: series/riser_nodes.csv  # node, station
        columns: {dy: aleDisp_y}
  downstream:
    zone: cyl2
    axis: x
    diameter: 1.0
    ends: [{at: 100.0, support: clamped}, {at: 112.0, support: clamped}]
  pendulum:
    virtual: true
    shape: pendulum
    params: {length: 2.5, bob: 0.5, rod: 0.06, swing: [0, 0, 1]}   # turns about z: swings along the span
    attach: {body: riser, station: 250}
    drive:
      angle: {series: swing, column: pendDisp}                     # radians
    series:
      swing: series/pendulum.csv
